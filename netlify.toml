# Netlify: static export served from the site root (no /Aerosphere-Coba- base path,
# which is only for GitHub Pages). Output goes to out/.
[build]
  command = "npm run build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # The site is a plain static export; the Next.js runtime plugin is not needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Turns on the "Analisis dengan AI" button; the function also needs ANTHROPIC_API_KEY
  # (set it in Netlify → Site configuration → Environment variables, never in this file).
  NEXT_PUBLIC_AI_IMPORT = "1"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pdf.worker.min.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
